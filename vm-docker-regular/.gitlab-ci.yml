# CI/CD pipeline for the vm-docker-regular Proxmox VM. Included from the
# repo root's .gitlab-ci.yml (GitLab only auto-discovers the root file).
# Stages: validate -> plan -> apply (manual) -> configure (manual) -> destroy (manual).
#
# Required CI/CD variables (Settings > CI/CD > Variables):
#   TF_VAR_pve_api_endpoint, TF_VAR_pve_api_token (masked), TF_VAR_pve_node,
#   TF_VAR_vm_template_name, TF_VAR_vm_name  — terraform reads TF_VAR_* automatically,
#   FABRICATOR_PRIVATE_KEY (masked, protected) — read by scripts/fetch-secret.sh
#     with SECRET_BACKEND=gitlab; swap for GitLab's native Vault/AWS `secrets:`
#     keyword if you have one of those set up instead.
# GitLab-managed Terraform state needs no extra variables: CI_API_V4_URL,
# CI_PROJECT_ID and CI_JOB_TOKEN are provided automatically (see scripts/tf-init.sh).

stages:
  - validate
  - plan
  - apply
  - configure
  - destroy

variables:
  TF_STATE_NAME: vm-docker-regular
  SECRET_BACKEND: gitlab

.docker_tf_before_script: &docker_tf_before_script
  - apk add --no-cache bash
  - cd vm-docker-regular
  - ./scripts/tf-init.sh

docker:validate:
  stage: validate
  image: hashicorp/terraform:1.9
  before_script: *docker_tf_before_script
  script:
    - terraform -chdir=terraform validate

docker:plan:
  stage: plan
  image: hashicorp/terraform:1.9
  before_script: *docker_tf_before_script
  script:
    - terraform -chdir=terraform plan -out=plan.tfplan
  artifacts:
    paths:
      - vm-docker-regular/terraform/plan.tfplan
    expire_in: 1 day

docker:apply:
  stage: apply
  image: hashicorp/terraform:1.9
  needs: ["docker:plan"]
  before_script: *docker_tf_before_script
  script:
    - terraform -chdir=terraform apply -auto-approve plan.tfplan
    - terraform -chdir=terraform output -raw vm_ipv4_address > vm_ipv4_address.txt
  artifacts:
    paths:
      - vm-docker-regular/vm_ipv4_address.txt
  when: manual

docker:configure:
  stage: configure
  image: python:3.12-slim
  needs: ["docker:apply"]
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends openssh-client && rm -rf /var/lib/apt/lists/*
    - pip install --no-cache-dir ansible-core
  script:
    - cd vm-docker-regular
    - ./scripts/configure.sh "$(cat vm_ipv4_address.txt)"
  when: manual

docker:destroy:
  stage: destroy
  image: hashicorp/terraform:1.9
  before_script: *docker_tf_before_script
  script:
    - terraform -chdir=terraform destroy -auto-approve
  when: manual
