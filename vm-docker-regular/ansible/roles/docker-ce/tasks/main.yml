---
# Installs Docker CE from Docker's official RHEL repo. Template OS is
# Rocky/AlmaLinux/Oracle Linux 10+, all of which consume the same repo as
# upstream RHEL.
- name: Ensure dnf-plugins-core is present (provides config-manager)
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present

- name: Add the Docker CE repo
  ansible.builtin.command:
    cmd: dnf config-manager --add-repo https://download.docker.com/linux/rhel/docker-ce.repo
    creates: /etc/yum.repos.d/docker-ce.repo

- name: Install Docker CE
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Enable and start docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Add fabricator to the docker group
  ansible.builtin.user:
    name: fabricator
    groups: docker
    append: true
